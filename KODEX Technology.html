<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--bg2:#0b0b0d;--tx:#fff;--mu:#a1a1aa;--ac:#536dff;--cy:#12a8ff;--ln:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 5vw 12px;backdrop-filter:blur(14px);background:rgba(5,5,5,.6);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px;line-height:1}
.logo svg{width:34px;height:28px}.logo small{display:block;font-size:7.5px;font-weight:400;letter-spacing:.5em;margin-top:4px;color:#d4d4d8}
nav ul{display:flex;gap:26px;list-style:none;padding:0;font-size:14px;color:var(--mu)}
nav ul a:hover{color:#fff}
.nr{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--ln);border-radius:99px;padding:3px;background:rgba(255,255,255,.03)}
.lang button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:99px;cursor:pointer;font:600 12px Inter,sans-serif;letter-spacing:.04em;transition:.3s}
.lang button[aria-pressed=true]{background:var(--ac);color:#fff;box-shadow:0 0 14px rgba(83,109,255,.5)}
@media(max-width:860px){nav ul{display:none}}
@media(max-width:560px){.nr .btn{display:none}.logo small{display:none}}
section{padding:130px 5vw;max-width:1200px;margin:auto;position:relative}
h1{font-size:clamp(2.8rem,9vw,8rem);line-height:.94;font-weight:800;letter-spacing:-.045em}
h2{font-size:clamp(1.8rem,4.2vw,3.2rem);line-height:1.08;font-weight:600;letter-spacing:-.03em;max-width:22ch}
p.lead{color:var(--mu);max-width:56ch;margin-top:20px}
.btn{display:inline-block;padding:14px 26px;border-radius:99px;font-weight:500;font-size:15px;border:1px solid var(--ln);background:none;color:#fff;cursor:pointer;font-family:inherit;transition:transform .2s,background .2s}
.btn.p{background:linear-gradient(90deg,var(--cy),var(--ac));border-color:transparent}
.btn:hover{background:#1a1b22}.btn.p:hover{filter:brightness(1.15);background:linear-gradient(90deg,var(--cy),var(--ac))}
#hero{min-height:100vh;max-width:none;display:flex;flex-direction:column;justify-content:center;padding-top:120px;overflow:hidden}
#hero>*:not(canvas){position:relative;z-index:2;max-width:1200px;width:100%;margin-left:auto;margin-right:auto}
#c{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#hero h1 span{display:block;background:linear-gradient(90deg,#fff 40%,#7fc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
#load{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center;transition:opacity .7s .5s,visibility 0s 1.2s}
#load .logo{font-size:26px;animation:pu 1s infinite alternate}#load .logo svg{width:60px;height:50px}#load small{font-size:11px}
@keyframes pu{from{opacity:.3}to{opacity:1}}
body.ready #load{opacity:0;visibility:hidden}
main{transition:opacity .25s}main.sw{opacity:0}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:56px}
.card{border:1px solid var(--ln);border-radius:18px;padding:28px;background:linear-gradient(160deg,#101014,var(--bg2));transition:transform .15s,border-color .3s;transform-style:preserve-3d}
.card:hover{border-color:rgba(83,109,255,.6)}
.card h3{font-size:1.15rem;font-weight:600;margin:10px 0 8px}
.card p,.card li{color:var(--mu);font-size:14.5px}
.card ul{padding-left:18px;margin:12px 0}
.card svg{width:34px;height:34px;stroke:var(--cy);fill:none;stroke-width:1.6}
.card .btn{padding:8px 16px;font-size:13px;margin-top:6px}
.sol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:56px}
.rail{position:relative;margin-top:70px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.rail::before,.rail i{content:"";position:absolute;top:7px;left:0;height:2px;background:var(--ln);width:100%}
.rail i{background:linear-gradient(90deg,var(--cy),var(--ac));box-shadow:0 0 14px var(--ac);width:0;transition:width .2s}
.st{position:relative;padding-top:34px}
.st::before{content:"";position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--ln);transition:.4s}
.st.on::before{border-color:var(--ac);background:var(--ac);box-shadow:0 0 16px var(--ac)}
.st h3{font-size:1.05rem}.st p{color:var(--mu);font-size:14px}
@media(max-width:800px){.rail{grid-template-columns:1fr}.rail::before,.rail i{display:none}.st{padding:0 0 0 32px}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{border:1px solid var(--ln);border-radius:99px;padding:8px 16px;font-size:14px;color:#d4d4d8;background:var(--bg2);animation:fl 5s ease-in-out infinite alternate}
.chip:nth-child(2n){animation-delay:-1.4s}.chip:nth-child(3n){animation-delay:-2.9s}
@keyframes fl{to{transform:translateY(-6px)}}
.grp{margin-top:40px}.grp h3{font-size:13px;color:var(--mu);font-weight:500}
.note{font-size:13px;color:var(--mu);margin-top:26px;max-width:70ch}
.mock{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#0a0a0d;margin-bottom:16px}
.mock .bar{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--ln)}
.mock .bar b{width:8px;height:8px;border-radius:50%;background:#2a2a30}
.mock .bd{height:92px;padding:12px;display:flex;align-items:flex-end;gap:6px}
.mock .bd s{flex:1;background:linear-gradient(var(--cy),#2a3380);border-radius:3px 3px 0 0;transition:height .6s}
.tag{display:inline-block;font-size:12px;color:#c7e6ff;border:1px solid rgba(18,168,255,.5);border-radius:6px;padding:1px 8px;margin-bottom:8px}
.tech{font-size:12.5px;color:var(--mu)}
.shift{margin-top:50px;border:1px solid var(--ln);border-radius:20px;padding:30px;background:var(--bg2)}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0}
.node{padding:10px 16px;border-radius:10px;border:1px solid var(--ln);font-size:14px;transition:.5s}
.arr{color:var(--mu);transition:.5s}
.shift.auto .node{border-color:var(--cy);background:rgba(18,168,255,.1);box-shadow:0 0 18px rgba(83,109,255,.25)}
.shift.auto .arr{color:var(--cy)}
.tg{display:inline-flex;border:1px solid var(--ln);border-radius:99px;padding:4px;flex-wrap:wrap}
.tg button{border:0;background:none;color:var(--mu);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.tg button[aria-pressed=true]{background:var(--ac);color:#fff}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 30px;margin-top:40px;list-style:none;padding:0;color:#d4d4d8}
.why li{border-top:1px solid var(--ln);padding-top:12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px;max-width:760px}
form .f{grid-column:span 2}
@media(max-width:639px){form{grid-template-columns:1fr}form .f{grid-column:auto}}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;color:#fff;font:inherit}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.err{color:#ff8a8a;font-size:12.5px;min-height:1em}
#ok{grid-column:1/-1;color:#9fe3b5}
footer{border-top:1px solid var(--ln);padding:60px 5vw calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;color:var(--mu);font-size:14px}
footer div{display:flex;flex-direction:column;gap:6px}
#cur{position:fixed;width:34px;height:34px;border:1px solid rgba(18,168,255,.7);border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-50%);transition:width .2s,height .2s;left:-50px;top:-50px}
#cur.h{width:56px;height:56px;background:rgba(83,109,255,.12)}
@media(hover:none){#cur{display:none}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
